name: Pro Chat Android Builder

'on':
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install Dependencies
    run: npm install

  - name: Prepare Game
    run: |
      mkdir -p www
      cp index.html www/

      for item in gifts icons music stickers; do
        if [ -d "$item" ]; then
          cp -R "$item" www/
        fi
      done

  - name: Prepare Icon
    run: |
      if [ ! -f icon-512.png ]; then
        echo "icon-512.png is missing from repository root"
        exit 1
      fi

      mkdir -p assets

      python -m pip install Pillow

      python - <<'PY'
      from PIL import Image
      img = Image.open("icon-512.png").convert("RGBA")
      img.resize((1024, 1024), Image.Resampling.LANCZOS).save("assets/icon-only.png")
      img.resize((2732, 2732), Image.Resampling.LANCZOS).save("assets/splash.png")
      PY

      npm install --no-save @capacitor/assets
      npx capacitor-assets generate --android

  - name: Add Android
    run: npx cap add android

  - name: Sync Android
    run: npx cap sync android

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug assembleRelease --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ProChat-Android
      path: android/app/build/outputs/apk/**/*.apk
      if-no-files-found: error
